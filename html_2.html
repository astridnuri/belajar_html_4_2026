<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coba Tabel dan CSS</title>
    <style>
        body {
            background-color: blanchedalmond;
            font-family: Arial, Helvetica, sans-serif;
            font-size: 14px;
        }

        table {
            background-color: aquamarine;
            width: 100%;
            border-collapse: collapse;
        }

        th,
        td {
            text-align: center;
            border: 1px solid black;
            padding: 10px;
        }

        th {
            background-color: blue;
            color:rgb(152, 234, 245)
        }
    </style>
</head>

<body>
    <h2 align="center">Daftar Mahasiswa</h2>
    
    <table>
        <tr>
            <th>No</th>
            <th>Nama</th>
            <th>No Loker</th>
        </tr>
        <tr>
            <td>1</td>
            <td>Astrid</td>
            <td>5025</td>
        </tr>
        <tr>
            <td>2</td>
            <td>Aira</td>
            <td>5026</td>
        </tr>
        <tr>
            <td>3</td>
            <td>Daffa</td>
            <td>5027</td>
        </tr>
        <tr>
            <td>4</td>
            <td>Inas</td>
            <td>5028</td>
        </tr>
    </table>
</body>

</html>
